<mat-form-field [appearance]="input.appearance || config.appearance" [floatLabel]="!!input.prefix ? 'always' : 'auto'">
    <mat-label>{{ input.title }}</mat-label>
    @if (formControl.invalid) {
        <mat-error>{{ formControl.errors | InputErrorPipe: input.type }}</mat-error>
    }

    <!-- HINT -->
    @if (input.hint) {
        <mat-hint>{{ input.hint }}</mat-hint>
    }

    <!-- SUFFIX -->
    @if (!!input.suffix) {
        <span matTextSuffix class="ngx-form-m3-input-suffix" [class.ngx-form-m3-disabled-input]="formControl.disabled">
            <span [class.ngx-form-m3-en]="input.suffixEnglish">{{ input.suffix }}</span>
        </span>
    }

    <!-- PREFIX -->
    @if (!!input.prefix) {
        <span matTextPrefix="" class="ngx-form-m3-input-prefix" [class.ngx-form-m3-disabled-input]="formControl.disabled">
            <span [class.ngx-form-m3-en]="input.prefixEnglish">{{ input.prefix }}</span>
        </span>
    }

    <!-- BUTTON -->
    @if (input.button) {
        <span matIconSuffix>
            <button
                mat-icon-button
                type="button"
                [disabled]="isButtonDisabled"
                (click)="input.button.onClick(values)"
                [tabIndex]="-1"
            >
                <mat-icon [style.color]="isButtonDisabled ? undefined : input.button.color">
                    {{ input.button.icon }}
                </mat-icon>
            </button>
        </span>
    }

    <input
        matInput
        type="text"
        [name]="input.name"
        [formControl]="formControl"
        [ngClass]="input.english ? 'ngx-form-m3-en' : ''"
        [maxLength]="input.maxLength || 524288"
        [AutoFocusDirective]="config.autoFocus === input.name"
        [readonly]="input.readonly"
    />

    <!-- DESCRIPTION -->
    @if (input.description) {
        <div
            class="ngx-form-m3-input-description"
            [class.ngx-form-m3-disabled-input]="formControl.disabled"
            [innerHTML]="input.description | MultiLinePipe"
        ></div>
    }
</mat-form-field>
